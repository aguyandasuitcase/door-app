name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Base bundle id (must fit your profile, e.g. com.yourprefix.door)"
        default: "com.doorapp.home"
      runner:
        description: "Runner as JSON"
        default: '["self-hosted","macOS","door"]'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runner || '["self-hosted","macOS","door"]') }}
    timeout-minutes: 30
    env:
      BUNDLE_ID: ${{ inputs.bundle_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Find the Linphone SDK version
        run: |
          for i in 1 2 3 4 5 6; do
            V=$(git ls-remote --tags --refs https://gitlab.linphone.org/BC/public/linphone-sdk-swift-ios.git 2>/dev/null | sed 's#.*refs/tags/##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            [ -n "$V" ] && break
            echo "gitlab not reachable, retry $i"; sleep 20
          done
          [ -n "$V" ] || { echo "Could not reach gitlab.linphone.org"; curl -sI --max-time 20 https://gitlab.linphone.org | head -3; exit 1; }
          echo "Linphone SDK $V"
          echo "LINPHONE_VERSION=$V" >> "$GITHUB_ENV"

      - name: Generate project
        run: (command -v xcodegen >/dev/null || brew install xcodegen) && xcodegen generate

      - name: Build (no signing)
        run: |
          xcodebuild build \
            -project DoorApp.xcodeproj -scheme DoorApp \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/DoorApp.app Payload/
          ls Payload/DoorApp.app/PlugIns Payload/DoorApp.app/Watch
          zip -qry DoorApp.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: DoorApp-ipa
          path: DoorApp.ipa

      - name: Publish release
        if: always() && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v gh >/dev/null || brew install gh
          gh release create "build-${{ github.run_number }}" DoorApp.ipa \
            --title "Unsigned IPA build ${{ github.run_number }}" \
            --notes "Unsigned IPA with widgets and Watch app. Sign it with zsign."
