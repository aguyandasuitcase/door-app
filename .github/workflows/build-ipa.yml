name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Base bundle id (must fit your profile, e.g. com.yourprefix.door)"
        default: "com.doorapp.home"
      runner:
        description: "Runner as JSON"
        default: '["self-hosted","macOS","door"]'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runner || '["self-hosted","macOS","door"]') }}
    timeout-minutes: 60
    env:
      BUNDLE_ID: ${{ inputs.bundle_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Get the Linphone SDK
        run: |
          if bash scripts/fetch-linphone.sh; then
            echo "SIP=1" >> "$GITHUB_ENV"
          else
            echo "Linphone SDK not reachable, building without SIP"
          fi

      - name: Generate project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          if [ "$SIP" = "1" ]; then
            python3 scripts/enable-sip.py
            xcodegen generate --spec project-sip.yml
          else
            xcodegen generate
          fi

      - name: Build (no signing)
        run: |
          xcodebuild build \
            -project DoorApp.xcodeproj -scheme DoorApp \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/DoorApp.app Payload/
          ls Payload/DoorApp.app/PlugIns Payload/DoorApp.app/Watch
          zip -qry DoorApp.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: DoorApp-ipa
          path: DoorApp.ipa

      - name: Publish release
        if: always() && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v gh >/dev/null || brew install gh
          gh release create "build-${{ github.run_number }}" DoorApp.ipa \
            --title "Unsigned IPA build ${{ github.run_number }}" \
            --notes "Unsigned IPA with widgets and Watch app. Sign it with zsign."
