name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Base bundle id (must fit your profile, e.g. com.yourprefix.door)"
        default: "com.doorapp.home"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      BUNDLE_ID: ${{ inputs.bundle_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate project
        run: brew install xcodegen && xcodegen generate

      - name: Build (no signing)
        run: |
          xcodebuild build \
            -project DoorApp.xcodeproj -scheme DoorApp \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/DoorApp.app Payload/
          ls Payload/DoorApp.app/PlugIns Payload/DoorApp.app/Watch
          zip -qry DoorApp.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: DoorApp-ipa
          path: DoorApp.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" DoorApp.ipa \
            --title "Unsigned IPA build ${{ github.run_number }}" \
            --notes "Unsigned IPA with widgets and Watch app. Sign it with zsign."
