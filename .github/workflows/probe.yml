name: Probe SDK hosts
on: workflow_dispatch
jobs:
  probe:
    runs-on: macos-26
    steps:
      - name: Probe
        run: |
          echo "== listing"; curl -sS -m 30 https://download.linphone.org/releases/ios/ | grep -o 'href="[^"]*"' | head -40
          echo "== podspec"
          h=$(printf linphone-sdk | md5 | cut -c1-3 | sed 's/\(.\)\(.\)\(.\)/\1\/\2\/\3/')
          echo $h
          curl -sS -m 30 "https://cdn.cocoapods.org/all_pods_versions_$(printf linphone-sdk | md5 | cut -c1-3 | sed 's/\(.\)\(.\)\(.\)/\1_\2_\3/').txt" | grep -i '^linphone' | head
