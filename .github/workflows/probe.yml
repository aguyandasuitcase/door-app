name: Probe wrapper API
on: workflow_dispatch
jobs:
  probe:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Look
        run: |
          bash scripts/fetch-linphone.sh >/dev/null
          grep -n -i "PortRange\|PortsRange\|func setAudioPort\|func setVideoPort\|var audioPort\|var videoPort\|sipTransportPort\|var transports\|class Transports\|var udpPort\|var tcpPort" Vendor/LinphoneWrapper.swift | head -30
