name: Probe SDK hosts
on: workflow_dispatch
jobs:
  probe:
    runs-on: macos-26
    steps:
      - name: Probe
        run: |
          curl -sS -m 30 https://download.linphone.org/releases/ios/ | grep -o 'href="linphone-sdk-[0-9.]*zip"' | sort -V | tail -5
          V=$(curl -sS -m 30 https://download.linphone.org/releases/ios/ | grep -o 'href="linphone-sdk-[0-9][0-9.]*[0-9]\.zip"' | sed 's/href="//;s/"//' | sort -V | tail -1)
          echo "LATEST=$V"
          curl -sS -m 600 -o sdk.zip "https://download.linphone.org/releases/ios/$V"
          ls -l sdk.zip
          unzip -l sdk.zip | awk '{print $4}' | grep -v '/.*/.*/.*/' | head -60
          unzip -l sdk.zip | grep -i 'linphonesw' | head -10
